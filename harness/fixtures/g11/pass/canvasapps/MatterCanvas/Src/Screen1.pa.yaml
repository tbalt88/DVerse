Screens:
  Screen1:
    Children:
      - Gallery1:
          Control: Gallery@2.15.0
          Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
          Properties:
            Items: =Matters
            X: =40
            Y: =40
          Children:
            - Image1:
                Control: Image@2.2.3
                Properties:
                  Height: =72
                  OnSelect: =Select(Parent)
                  Width: =72
                  X: =16
            - Title1:
                Control: Label@2.5.1
                Properties:
                  Text: =ThisItem.'Matter Name'
                  Size: =14
                  X: =103
