# Slice 7.2 fixture (semantic diff engine, walker + property-level verdicts).
# Target side of the lesson-14 flagship. Byte-identical to a.yml at every
# id at every level (formid, tab, section, all four cells, all four
# controls). The ONLY difference anywhere in this file: the dv_openedon
# control's '@datafieldname' reads 'dv_OpenedOn' here instead of
# 'dv_openedon'. Expected walk result: systemform Unchanged (recurses
# anyway per ruling 3), tab Unchanged (recurses), column Matched-positional-
# Unchanged (recurses, still warns per ruling 3's "every such match"),
# section Unchanged (recurses), all four rows Matched-positional-Unchanged
# (recurses, still warns), all four cells Unchanged (recurses), three of
# four controls Unchanged, and the dv_openedon control alone Changed with
# exactly one PropertyChange: path '@datafieldname', ValueInA
# 'dv_openedon', ValueInB 'dv_OpenedOn'. That Changed verdict also carries
# the inherited positional-row warning and the "unverified pairing,
# content-confirmed only" phrase, since it sits under a positionally
# matched row (ruling 5), even though the control's own '@id' match is a
# confident GUID-equivalent exact match, not itself a fallback.
