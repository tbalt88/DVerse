# Slice 7.2 fixture (semantic diff engine, walker + property-level verdicts).
# Target side. Byte-identical to a.yml except one formula: DataCardValue1's
# 'Width' property reads '=Parent.Width - 80' here instead of
# '=Parent.Width - 60'. Everything else, at every nesting level (Form1,
# Matter Name_DataCard1, DataCardKey1, and DataCardValue1's every other
# property), is unchanged. Expected walk result: Screen1 Unchanged
# (recurses), Form1 Unchanged (recurses), "Matter Name_DataCard1" Unchanged
# (recurses), DataCardKey1 Unchanged, DataCardValue1 Changed with exactly
# one PropertyChange: path 'Properties.Width', ValueInA '=Parent.Width -
# 60', ValueInB '=Parent.Width - 80' -- the leading '=' preserved verbatim
# per ruling 4. No warnings anywhere in this fixture: canvas identity is
# exact-key matching, never positional.
Screens:
  Screen1:
    Children:
      - Form1:
          Control: Form@2.4.4
          Variant: Classic
          Layout: Vertical
          Properties:
            DataSource: |+
              =Matters
            Item: =Gallery1.Selected
            Width: |+
              =560
            X: |+
              =720
            Y: =60
          Children:
            - Matter Name_DataCard1:
                Control: TypedDataCard@1.0.7
                Variant: ClassicTextualEdit
                IsLocked: true
                Properties:
                  DataField: ="dv_name"
                  Default: =ThisItem.'Matter Name'
                  DisplayName: =DataSourceInfo([@Matters],DataSourceInfo.DisplayName,'dv_name')
                  MaxLength: =DataSourceInfo([@Matters], DataSourceInfo.MaxLength, 'dv_name')
                  Required: =true
                  Update: =DataCardValue1.Text
                  Width: =186
                  X: =0
                  Y: =0
                Children:
                  - DataCardKey1:
                      Control: Label@2.5.1
                      MetadataKey: FieldName
                      Properties:
                        AutoHeight: =true
                        BorderColor: =RGBA(0, 0, 0, 1)
                        Color: =App.Theme.Colors.Darker30
                        Height: =34
                        Text: =Parent.DisplayName
                        Width: =Parent.Width - 60
                        Wrap: =false
                        X: =30
                        Y: =10
                  - DataCardValue1:
                      Control: Classic/TextInput@2.3.2
                      MetadataKey: FieldValue
                      Properties:
                        BorderColor: =If(IsBlank(Parent.Error), Parent.BorderColor, Color.Red)
                        Default: =Parent.Default
                        DelayOutput: =true
                        DisplayMode: =Parent.DisplayMode
                        MaxLength: =Parent.MaxLength
                        PaddingLeft: =5
                        Tooltip: =Parent.DisplayName
                        Width: =Parent.Width - 80
                        X: =30
                        Y: =DataCardKey1.Y + DataCardKey1.Height + 5
