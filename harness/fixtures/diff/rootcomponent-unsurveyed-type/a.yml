# Slice 7.1i fixture (matching layer). Baseline side of the "unsurveyed
# component type" mutation pair. The five real entries are copied verbatim
# from demo-solution/solutions/DVerseCore/rootcomponents.yml (types 1, 62,
# 80, 91, 92 -- the only types this project's identity model has ever
# platform-mirror confirmed, RootComponentMatcher.SurveyedTypes). Two
# additional entries, of types this model has never surveyed, are appended
# to exercise seat ruling 8: type '20' schemaName dv_customrole (present
# unchanged in b.yml too, to prove a MATCHED unsurveyed-type entry still
# warns) and type '30' schemaName dv_legacywidget (present only here, to
# prove a REMOVED unsurveyed-type entry still warns). Neither '20' nor '30'
# is a claim about what those numeric ComponentType values really mean on
# the platform; they exist only to be outside RootComponentMatcher's known
# set.
