# AUTHORITY (slice 4.4c): the platform's own export, not docs, not the 4.4b guessed shape. 4.4b
# authored this element from decompile (for what pac itself reads) plus well-established schema
# knowledge (for what pac passes through opaque); import rejected that authored shape through four
# distinct rungs, each surfaced only by a live import attempt against the running org (commit
# f203540): (1) the RootComponent '@schemaName' for a PluginAssembly must be the assembly's FullName,
# not a bare name; (2) the FileName part URI needs a leading slash; (3) a Sandbox-isolation assembly
# must be strong-named (a public key token is required), so this repo now builds and packs a signed
# DVerse.Plugins.dll (DVerse.Plugins.snk committed, no longer gitignored); and (4) the PluginType
# element shape was still wrong even after fixing the first three. Rather than guess a fifth time, the
# seat registered the plugin via the org Web API (assembly + type + step, a seat-only write this
# executor never performed) and ran `pac solution clone --name DVerseCore` (read-only, dverse-ci
# profile) to read back the platform's own canonical XML for this component. That clone output is
# quoted verbatim in loop/specs/wave4-4c-canonical-plugin-shapes.md and is the sole authority for the
# element set and attribute/child shape below; this slice replaces the 4.4b-guessed shape with a literal
# transcription of it. The platform ids are adopted verbatim (PluginAssemblyId 5af6f42c-9a97-f111-b8de-
# 70a8a59a66f9, PluginTypeId 0f998a3b-9a97-f111-b8de-70a8a59a66f9) so the next import UPDATES the
# already-registered components instead of duplicating them.
#
# FIELDS READ BY PAC ITSELF (unchanged from 4.4b's decompile: ilspycmd 11.0.0.9375 against pac 2.10.1's
# SolutionPackagerLib.dll, PluginAssemblyProcessor.CreateComponent):
#   '@PluginAssemblyId' : XML ATTRIBUTE (Helper.GetAttributeValue), GUID, throwIfNull: true (required)
#   '@FullName'         : XML ATTRIBUTE, throwIfNull: false -> becomes Component.PrimaryName
#   FileName            : CHILD ELEMENT (Helper.GetElementValue), throwIfNull: false
#   SourceType          : CHILD ELEMENT, throwIfNull: false, Helper.IntConverter, default 0
# Every other field is passed through into the packed customizations.xml completely opaque to pac
# (AddComponentElement / XElement.AddAndLiftNamespace is a raw append); those fields are now transcribed
# from the canonical export rather than authored from schema knowledge, per the authority note above.
#
# FILENAME DEVIATION (deliberate, the one field NOT taken verbatim from canonical): the platform's own
# FileName reads "/PluginAssemblies/DVersePlugins-5AF6F42C-9A97-F111-B8DE-70A8A59A66F9/DVersePlugins.dll"
# (its own storage path inside the org). This repo's pack layout carries the DLL at
# pluginassemblies/DVerse.Plugins.dll instead (see the FOLDER NAME and HOW THE BINARY IS CARRIED notes
# below, both still decompile-true), so FileName here stays "/pluginassemblies/DVerse.Plugins.dll" --
# our own part path, with the leading slash rung 2 above proved mandatory. Every other element and
# attribute below matches the canonical export exactly, including that it carries no Name, Culture,
# Version, or PublicKeyToken as separate children (Version and PublicKeyToken live only inside
# '@FullName' and PluginType's '@AssemblyQualifiedName') and no TypeName/AssemblyName/
# IsWorkflowActivity on PluginType -- all fields the 4.4b-guessed shape carried that the canonical
# export simply does not have.
#
# FOLDER NAME (still true, decompile-confirmed, slice 4.4b): PluginAssemblyProcessor's ctor is
# base("SolutionPluginAssemblies", ComponentType.PluginAssembly). ComponentConfigurationManager.GetConfiguration
# lowercases the ComponentConfigurationCollection entry's directory ("PluginAssemblies" ->
# "pluginassemblies") for the new (YAML) format, so pac looks for plugin assembly content under
# demo-solution/pluginassemblies/.
#
# WHY THIS FILE IS NOT NAMED PluginAssemblies.yml (still true, slice 4.4b, empirically caught): pac's
# single-collection-file read branch (File.Exists(pluginassemblies/PluginAssemblies.yml)) never calls
# LoadComponentFiles, so a file with that exact name packs exit 0 with the DLL's bytes silently absent
# from context.Customizations.ComponentFiles and therefore absent from the zip. Any other file name
# (this file, DVerse.Plugins.yml) forces the SECOND branch (isFileBackedComponent &&
# Directory.Exists(...)), which builds the SolutionPluginAssemblies wrapper in code, scans this folder
# for "*.yml" via GetComponentFiles -> ApplySolutionFilter (per lesson 2, guarded by
# solutions/DVerseCore/solutioncomponents.yml's 'pluginassemblies' '@path' entry), appends this file's
# root element as a child, then calls CreateComponents followed by LoadComponentFiles -- the call that
# actually reads Path.Combine(context.RootFolder, DiskFileName) off disk and registers the DLL's bytes,
# so it reaches the packed zip. Confirmed empirically in 4.4b: the packed zip carried
# pluginassemblies/DVerse.Plugins.dll as its own part once renamed off "PluginAssemblies.yml".
#
# HOW THE BINARY ITSELF IS CARRIED (decompile-confirmed, slice 4.4b): FileBackedComponent.DiskFileName
# defaults to FileName itself (leading slash stripped, separators normalized); LoadComponentFile reads
# Path.Combine(context.RootFolder, DiskFileName) directly off disk at pack time and registers those raw
# bytes keyed by FileName's relative Uri -- the DLL is carried as a SIBLING FILE inside the packaged
# solution zip at the exact path FileName names below, never as inline base64 in this YAML or in
# customizations.xml.
#
# BUILD CONFIGURATION (unchanged from 4.4b except signing, per rung 3 above): pluginassemblies/
# DVerse.Plugins.dll is the Debug, net462 build of demo-solution/plugins/DVerse.Plugins
# (`dotnet build demo-solution/plugins/DVerse.Plugins/DVerse.Plugins.csproj -c Debug`), now signed with
# the committed DVerse.Plugins.snk. '@FullName's Version=1.0.0.0, PublicKeyToken=9f506971365378cc was
# read back from that signed built artifact with
# [System.Reflection.AssemblyName]::GetAssemblyName(...).FullName, not assumed, and matches the
# canonical export's own '@FullName' exactly.
#
# SourceType=0 (Database) and IsolationMode=2 (Sandbox): both present verbatim in the canonical export
# below; SourceType=0 additionally decompile-corroborated in 4.4b (PluginAssemblyProcessor.WriteComponentFile's
# explicit "else if (fileBackedComponent.SourceType == 3)" branch labelled "WebConnected" confirms 3 is
# not 0, by exclusion).
PluginAssembly:
  '@FullName': 'DVerse.Plugins, Version=1.0.0.0, Culture=neutral, PublicKeyToken=9f506971365378cc'
  '@PluginAssemblyId': '5af6f42c-9a97-f111-b8de-70a8a59a66f9'
  '@CustomizationLevel': '1'
  IsolationMode: 2
  SourceType: 0
  IntroducedVersion: '1.0'
  FileName: /pluginassemblies/DVerse.Plugins.dll
  PluginTypes:
    PluginType:
      '@AssemblyQualifiedName': 'DVerse.Plugins.MatterNumberValidator, DVerse.Plugins, Version=1.0.0.0, Culture=neutral, PublicKeyToken=9f506971365378cc'
      '@PluginTypeId': '0f998a3b-9a97-f111-b8de-70a8a59a66f9'
      '@Name': DVerse.Plugins.MatterNumberValidator
      FriendlyName: DVerse.Plugins.MatterNumberValidator
