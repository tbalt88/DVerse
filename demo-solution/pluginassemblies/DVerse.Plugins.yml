  '@FullName': 'DVerse.Plugins, Version=1.0.0.0, Culture=neutral, PublicKeyToken=null'
  Name: DVerse.Plugins
  FileName: pluginassemblies/DVerse.Plugins.dll
  SourceType: 0
  IsolationMode: 2
  Culture: neutral
  Version: 1.0.0.0
  PublicKeyToken: 'null'
  PluginTypes:
    PluginType:
      '@PluginTypeId': '67574aef-2c54-4bf8-9f29-7efebf321aed'
      Name: DVerse.Plugins.MatterNumberValidator
