# GROUND TRUTH (slice 4.2, ilspycmd against pac 2.10.1's SolutionPackagerLib.dll):
# EntityProcessor.ReadEntityDirectory (class Microsoft.Crm.Tools.SolutionPackager.EntityProcessor)
# loads this file via ComponentProcessorBase.ReadSubComponent(entityDirectory, "Entity", ".yml"),
# i.e. entities/<schemaname>/Entity.yml, and requires a top-level 'Name' child
# (Helper.GetElementValue(element, "Name", throwIfNull: true) inside CreateComponent) holding the
# entity schema name as plain text. EntityInfo/entity must exist (non-null) because the same method
# does 'xElement.Element("EntityInfo")?.Element("entity")?.Add(new XElement("attributes"))' and the
# matching call for EntityKeys: a null EntityInfo or entity silently drops the folder-sourced
# attributes instead of erroring, so both must be present here. FormXml, SavedQueries, and
# RibbonDiffXml are added by the same method as fresh empty elements ('xElement.Add(new
# XElement("FormXml"))' etc.) and must NOT be declared in this file or the reader would end up with
# duplicate elements alongside the ones it adds itself.
#
# SLICE 4.2b: rebuilt against the PLATFORM-AUTHORED reference (a real `Probe` table created via the
# maker portal, cloned back with `pac solution clone` to
# C:\Users\dmdom\AppData\Local\Temp\probe-clone\DVerseCore\src\Entities\dv_Probe\Entity.xml, READ-ONLY).
# 4.2's Entity.yml carried only the LocalizedNames/LocalizedCollectionNames/Descriptions block; the
# reference proves a real platform-authored entity carries a large flat set of entity-level default
# elements below that (EntitySetName through IsSolutionAware) that 4.2 never had at all. The mission's
# "SyncError relationship step, which points at missing ownership metadata" (see dv_matterid.yml) is
# most directly explained by the absence of OwnershipTypeMask below: 4.2's file had no ownership
# metadata whatsoever. All values below are copied verbatim from the reference except where renamed
# for our table (EntitySetName dv_probes -> dv_matters); every other scalar default is the platform's
# own value for a plain UserOwned custom entity, not a guess.
#
# CASING: the reference's top-level Name element and its EntityInfo/entity/@Name attribute both read
# "dv_Probe" (schema-name casing, capital P), distinct from the all-lowercase LogicalName used
# everywhere inside attributes (dv_probeid, dv_name, ...). This mirrors the same PhysicalName-style
# casing seen on attribute PhysicalName values (dv_ProbeId, dv_Name). Renamed to "dv_Matter" here.
# The folder path itself stays lowercase dv_matter (owned-files scope in the wave4-2b spec), unrelated
# to this element's text value.
Entity:
  Name: dv_Matter
  EntityInfo:
    entity:
      '@Name': dv_Matter
      LocalizedNames:
        LocalizedName:
          '@description': Matter
          '@languagecode': '1033'
      LocalizedCollectionNames:
        LocalizedCollectionName:
          '@description': Matters
          '@languagecode': '1033'
      Descriptions:
        Description:
          '@description': A legal matter tracked by the DVerse demo solution.
          '@languagecode': '1033'
      EntitySetName: dv_matters
      IsDuplicateCheckSupported: '1'
