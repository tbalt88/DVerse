# GROUND TRUTH: EntityProcessor.ReadEntityDirectory calls
# ReadFormXmlCollectionsFromFolder(entityDirectory/FormXml, xElement.Element("FormXml"), "forms",
# "type") unconditionally. That method lists each subdirectory of FormXml/ (here: "main"), builds a
# <forms type="main"> wrapper, and for every file inside reads it with ReadCollectionFromFiles.
# Because ParentTagForNestedMultiLcids="forms" and ChildTagForNestedMultiLcids="systemform" are set
# just before the call, AddNestedSubcollection accepts a file whose root is either 'forms' (with
# nested 'systemform' children extracted) or 'systemform' directly (added as-is); this file keeps
# 4.2's established simpler 'systemform' root per mission ruling 2 ("keep the established @attr and
# element conventions the packer round-trips").
#
# SLICE 4.2b: REPLACES 4.2's invented form. Transcribed structurally from the reference
# platform-authored unmanaged main form
# (C:\Users\dmdom\AppData\Local\Temp\probe-clone\DVerseCore\src\Entities\dv_Probe\FormXml\main\
# {3a9c8b5f-5305-4ec4-a3f4-0fa78635fb36}.xml, READ-ONLY). That comparison proved 4.2's form shape was
# wrong at the systemform level, not just at the field level: 4.2 had `name: Matter`, `type: '2'`, and
# lowercase `formactivationstate` -- none of which exist in the reference at all. The reference instead
# carries IntroducedVersion, FormPresentation, and PascalCase FormActivationState as direct systemform
# children, no `name` or `type` element (the form's "main" classification comes from the FormXml/main/
# folder wrapper the reader builds, not from file content), plus LocalizedNames/Descriptions blocks
# 4.2 never had. Those structural elements, and the tab/section/row/cell attribute shapes
# (verticallayout, IsUserDefined, showlabel="false"/showbar="false", GUID-braced ids), are copied
# verbatim from the reference below, with fresh GUIDs per mission ruling 5 (formid and the internal
# tab/section/cell ids are none of them reused from the probe).
#
# FIELD ROWS: the reference form has exactly one custom-attribute row (dv_Name) plus the standard
# ownerid row; the probe table has no matternumber/openedon analogue. The dv_name and ownerid rows
# below are a literal transcription (same control classids, same cell/label shape). The
# dv_matternumber and dv_openedon rows are NOT literally evidenced by the reference -- they are
# added by repeating the reference's own row/cell/control pattern once per remaining business
# attribute, matching control classid by type: dv_matternumber reuses dv_name's text-box classid
# (both are nvarchar); dv_openedon uses classid {5B773807-9FB2-42db-97C3-7A91EFF8ADFF}, the standard
# Dataverse DateTime control (carried from 4.2's original, unverified-by-reference authoring, since
# the probe reference has no datetime custom field to mirror). This is the one part of this file that
# is pattern-extension rather than literal transcription; flagged here and in the slice report.
#
# datafieldname casing: the reference's dv_Name control uses datafieldname="dv_Name" (PhysicalName
# casing), while its ownerid control uses lowercase "ownerid" (LogicalName casing, a system field).
# Mirrored here: our three custom controls use PhysicalName casing (dv_Name, dv_MatterNumber,
# dv_OpenedOn); the ownerid control keeps lowercase, matching the reference's own system-field pattern.
systemform:
  formid: 8d5fde37-9293-4b1e-97bb-2691167f3ee0
  IntroducedVersion: '1.0'
