# AUTHORITY (slice 4.4c): the platform's own export, not docs, not the 4.4b guessed shape. See
# pluginassemblies/DVerse.Plugins.yml's header for the full account of why: 4.4b's authored shape for
# this component (self-generated SdkMessageId/SdkMessageFilterId placeholders, an authored PluginType
# element shape) was rejected across four import rungs recorded in commit f203540, so the seat
# registered the plugin (assembly + type + step) via the org Web API directly and ran
# `pac solution clone --name DVerseCore` (read-only, dverse-ci profile) to read back the platform's own
# canonical XML for this component. That clone output is quoted verbatim in
# loop/specs/wave4-4c-canonical-plugin-shapes.md and is the sole authority for the element set below;
# this slice replaces the 4.4b-guessed shape with a literal transcription of it, adopting the platform
# id verbatim (SdkMessageProcessingStepId {10998a3b-9a97-f111-b8de-70a8a59a66f9}, braced exactly as the
# canonical export has it) so the next import UPDATES the already-registered step instead of duplicating
# it.
#
# SdkMessageFilterId, the 4.4b report's stated highest import risk, DOES NOT APPEAR in the canonical
# export at all: the platform step carries PrimaryEntity (dv_matter, the logical name) instead, which is
# org-portable and needs no org-specific filter GUID lookup. It is dropped here for that reason, not
# omitted by oversight.
#
# FOLDER NAME AND READ SHAPE (still true, decompile-confirmed, slice 4.4b: ilspycmd 11.0.0.9375 against
# pac 2.10.1's SolutionPackagerLib.dll): SdkMessageProcessingStepProcessor's ctor is
# base("SdkMessageProcessingSteps", ComponentType.SdkMessageProcessingStep) with isCollectionComponent
# = true, and it overrides ReadFromFiles completely rather than using the base class's
# GetComponentPath / single-collection-file convention PluginAssembly uses. Its own ReadFromFiles:
#   1. mainDirectory = GetMainDirectory(SdkMessageProcessingStep) -> the ComponentConfigurationCollection
#      entry ("SdkMessageProcessingSteps", "$(PrimaryName)"), lowercased for the new format, resolves
#      to solutions-root-relative "sdkmessageprocessingsteps/".
#   2. Directory.GetFiles(mainDirectory, "*.yml", SearchOption.AllDirectories) -- every .yml anywhere
#      under this folder, not gated to one level.
#   3. files = ApplySolutionFilter(files, mainDirectory) -- the generic StartsWith-prefix filter
#      (ComponentProcessorBase.ApplySolutionFilter), active because
#      solutions/DVerseCore/solutioncomponents.yml already lists a 'sdkmessageprocessingsteps' '@path'
#      entry (per lesson 2).
#   4. Each surviving file is loaded whole (XUtils.LoadElement -> Helper.ConvertYamlToXml, the same
#      YAML-to-XML round trip behind every other '@attr' file in this repo) and its root element is
#      added AS ONE COMPONENT into the SdkMessageProcessingSteps wrapper: one file = one step. This
#      file is authored standalone (not nested under a $(PrimaryName) subfolder) because nothing in
#      the decompiled reader requires that nesting for this component type -- unlike AppModule/Role,
#      which do require it.
#
# FIELD READ BY PAC ITSELF (unchanged, slice 4.4b decompile, same decompiled type): only
# '@SdkMessageProcessingStepId' (XML ATTRIBUTE, Helper.GetAttributeValue, GUID, throwIfNull: true,
# required). PrimaryName is never set by this processor (stays null). Every other field below is
# passed through into the packed customizations.xml completely opaque to pac (the same
# AddComponentElement raw-append behaviour documented in DVerse.Plugins.yml's header) and is now
# transcribed from the canonical export rather than authored from schema knowledge.
#
# '@Name' and '@SdkMessageProcessingStepId' are XML ATTRIBUTES in the canonical export (the opening
# <SdkMessageProcessingStep Name="..." SdkMessageProcessingStepId="..."> tag), unlike 4.4b's guessed
# shape which carried Name as a plain child element. SdkMessageProcessingStepId is brace-wrapped in the
# canonical export; PluginTypeId (a CHILD ELEMENT here, holding the plain GUID text) is not.
#
# FilteringAttributes and SdkMessageProcessingStepImages are present-but-empty elements in the
# canonical export (<FilteringAttributes></FilteringAttributes> and
# <SdkMessageProcessingStepImages />). This repo's established convention for a present-but-empty
# element is an empty YAML mapping (see solutions/DVerseCore/missingdependencies.yml's
# 'MissingDependencies: {}', the same Helper.ConvertYamlToXml round trip), used for both below rather
# than omitting them (an absent key would produce no element at all, a different XML shape than the
# canonical export's empty-but-present elements).
#
# Encodings (Stage=20 PreOperation, Mode=0 Synchronous, SupportedDeployment=0 Server Only,
# InvocationSource=1, EventHandlerTypeCode=4602) are taken verbatim from the canonical export, not
# re-derived; they happen to match the long-stable, widely-attested Dataverse platform enum values
# 4.4b used from schema knowledge for Stage/Mode/SupportedDeployment.
SdkMessageProcessingStep:
