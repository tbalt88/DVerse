# GROUND TRUTH (slice 4.4b, ilspycmd 11.0.0.9375 against pac 2.10.1's SolutionPackagerLib.dll, same
# assembly and technique as pluginassemblies/PluginAssemblies.yml's header; see that file for the
# exact tool path).
#
# FOLDER NAME AND READ SHAPE: SdkMessageProcessingStepProcessor's ctor is
# base("SdkMessageProcessingSteps", ComponentType.SdkMessageProcessingStep) with isCollectionComponent
# = true, and it overrides ReadFromFiles completely rather than using the base class's
# GetComponentPath / single-collection-file convention PluginAssembly uses. Its own ReadFromFiles:
#   1. mainDirectory = GetMainDirectory(SdkMessageProcessingStep) -> the ComponentConfigurationCollection
#      entry ("SdkMessageProcessingSteps", "$(PrimaryName)"), lowercased for the new format, resolves
#      to solutions-root-relative "sdkmessageprocessingsteps/".
#   2. Directory.GetFiles(mainDirectory, "*.yml", SearchOption.AllDirectories) -- every .yml anywhere
#      under this folder, not gated to one level.
#   3. files = ApplySolutionFilter(files, mainDirectory) -- the generic StartsWith-prefix filter
#      (ComponentProcessorBase.ApplySolutionFilter) shared by most processors, distinct from the
#      strict Directory.GetDirectories + exact-match check AppModule/AppModuleSiteMap/Role use. Because
#      solutions/DVerseCore/solutioncomponents.yml already has entries (a non-empty
#      SolutionComponentFiles set), this filter is ACTIVE: a file only survives if its directory equals
#      or is nested under some '@path' entry. A path entry for this folder is required per lesson 2;
#      see solutions/DVerseCore/solutioncomponents.yml, which now lists 'sdkmessageprocessingsteps'.
#      Because the filter is prefix-based (not the AppModule-style exact subfolder match), one entry
#      for the parent folder covers this file regardless of nesting depth.
#   4. Each surviving file is loaded whole (XUtils.LoadElement -> Helper.ConvertYamlToXml, the same
#      YAML-to-XML round trip behind every other '@attr' file in this repo) and its root element is
#      added AS ONE COMPONENT into the SdkMessageProcessingSteps wrapper: one file = one step. This
#      file is authored standalone (not nested under a $(PrimaryName) subfolder) because nothing in
#      the decompiled reader requires that nesting for this component type -- unlike AppModule/Role,
#      which do require it.
#
# FIELD READ BY PAC ITSELF (CreateComponent, same decompiled type): only
# '@SdkMessageProcessingStepId' (XML ATTRIBUTE, Helper.GetAttributeValue, GUID, throwIfNull: true,
# required). PrimaryName is never set by this processor (stays null). Every other field below is
# passed through into the packed customizations.xml completely opaque to pac (the same
# AddComponentElement raw-append behaviour documented in PluginAssemblies.yml's header) and is
# authored from the well-established real Dataverse SdkMessageProcessingStep solution schema, not
# from pac decompile or from Microsoft docs consulted as authority.
#
# SdkMessageId and SdkMessageFilterId below are REAL org values, resolved by the seat at grading
# (the executor could not reach them; its placeholders were replaced in the grading merge):
# SdkMessageId from `pac org fetch` (sdkmessage where name = Create), SdkMessageFilterId from the
# org Web API (sdkmessagefilters where primaryobjecttypecode = 'dv_matter' and sdkmessageid =
# Create). Note primaryobjecttypecode is Edm.String in the Web API despite FetchXML typing it Int32.
#
# Encodings used below (Stage, Mode, SupportedDeployment) are the long-stable, widely-attested
# Dataverse platform enum values (10/20/40 = PreValidation/PreOperation/PostOperation stage;
# 0/1 = Synchronous/Asynchronous mode; 0 = Server Only deployment), not pac-decompiled -- pac carries
# this whole element as opaque data and never reads these fields itself.
