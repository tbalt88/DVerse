# SLICE 4.6t: dv_MatterApp's AppModule (type 80) and its sitemap (type 62, ComponentType.SiteMap -- NOT
# 81/AppModuleSiteMap; see demo-solution/appmodulesitemaps/dv_MatterApp/appmodulesitemap.yml's header for
# the decompiled-enum-vs-platform-solution.xml evidence) added as their own root components, mirrored
# verbatim (type, schemaName, behavior) from the org's own exported Other/Solution.xml
# (`pac solution clone --name DVerseCore`, read-only, dverse-ci profile). Neither object is a
# subcomponent of dv_matter's entity root; each needs its own RootComponent entry to be included in the
# solution at all. behavior="0" (include-all) is carried over from the same ground truth for the existing
# dv_matter entry too, made explicit here rather than left to the packer's default.
#
# SLICE 4.4b: PluginAssembly (type 91) and SdkMessageProcessingStep (type 92) added, numeric codes
# decompile-verified against pac 2.10.1's SolutionPackagerLib.dll's ComponentType enum (ilspycmd; see
# pluginassemblies/DVerse.Plugins.yml's header for the exact tool path). Both entries are REQUIRED for
# pack to succeed, not merely conventional: a first pack attempt with no RootComponent entries for
# these two new components failed outright (exit code 2, "RootComponent validation failed... Following
# objects, required by the solution, are not present. Type='PluginAssembly', Id (or schema
# name)='{...}'. Type='SdkMessageProcessingStep', Id (or schema name)='{...}'."). This is empirical,
# stronger than decompile alone.
#
# SLICE 4.4c: both entries below now mirror the platform's own canonical export verbatim
# (`pac solution clone --name DVerseCore`, read-only, dverse-ci profile; quoted in
# loop/specs/wave4-4c-canonical-plugin-shapes.md, the sole authority), replacing 4.4b's guessed
# both-id-and-schemaName shape for type 92. The canonical export settles what 4.4b could only guess at:
#   - type 91 (PluginAssembly) keeps BOTH '@id' (braced, matching the canonical export's own
#     id="{5af6f42c-...}" on this RootComponent) and '@schemaName' (the assembly's FullName, per import
#     rung 1 in commit f203540 -- a PluginAssembly's schemaName must be the FullName, not a bare name).
#     This is the one entry where the platform's own writer really does carry both attributes.
#   - type 92 (SdkMessageProcessingStep) is '@id' ONLY (braced), with NO '@schemaName' at all -- exactly
#     what the canonical export has. 4.4b's report called omitting '@schemaName' here a G8 gate risk and
#     added a redundant '@schemaName' to satisfy G8's then-unconditional refusal on a blank
#     '@schemaName'. The canonical export proves that redundant attribute was never a pac requirement,
#     only a gap in G8: a GUID-identified component type legitimately has no schema name. G8
#     (harness/DVerse.Harness/Gates/RootComponentSourceGate.cs) was fixed this slice to accept an
#     id-only entry instead of demanding a schemaName workaround; see that file's own header for the
#     fix and its mutation-check evidence.
# Both ids adopted verbatim from the canonical export so the next import UPDATES the already-registered
# components (matching '@PluginAssemblyId'/'@SdkMessageProcessingStepId' on the corresponding component
# files) instead of duplicating them.
RootComponents:
  RootComponent:
    - '@type': '1'
      '@schemaName': dv_matter
      '@behavior': '0'
    - '@type': '62'
      '@schemaName': dv_MatterApp
      '@behavior': '0'
    - '@type': '80'
      '@schemaName': dv_MatterApp
      '@behavior': '0'
    - '@type': '91'
      '@id': '{5af6f42c-9a97-f111-b8de-70a8a59a66f9}'
      '@schemaName': 'DVerse.Plugins, Version=1.0.0.0, Culture=neutral, PublicKeyToken=9f506971365378cc'
      '@behavior': '0'
    - '@type': '92'
      '@id': '{10998a3b-9a97-f111-b8de-70a8a59a66f9}'
      '@behavior': '0'

