# SLICE 4.6t: dv_MatterApp's AppModule (type 80) and its sitemap (type 62, ComponentType.SiteMap -- NOT
# 81/AppModuleSiteMap; see demo-solution/appmodulesitemaps/dv_MatterApp/appmodulesitemap.yml's header for
# the decompiled-enum-vs-platform-solution.xml evidence) added as their own root components, mirrored
# verbatim (type, schemaName, behavior) from the org's own exported Other/Solution.xml
# (`pac solution clone --name DVerseCore`, read-only, dverse-ci profile). Neither object is a
# subcomponent of dv_matter's entity root; each needs its own RootComponent entry to be included in the
# solution at all. behavior="0" (include-all) is carried over from the same ground truth for the existing
# dv_matter entry too, made explicit here rather than left to the packer's default.
RootComponents:
  RootComponent:
    - '@type': '1'
      '@schemaName': dv_matter
      '@behavior': '0'
    - '@type': '62'
      '@schemaName': dv_MatterApp
      '@behavior': '0'
    - '@type': '80'
      '@schemaName': dv_MatterApp
      '@behavior': '0'

