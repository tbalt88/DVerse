# entities/dv_matter/FormXml/main is listed separately from entities/dv_matter itself: pac's
# EntityProcessor.ReadFormXmlCollectionsFromFolder filters FormXml subfolders with
# 'SolutionComponentFiles.Where(componentFile => componentFile.StartsWith(absoluteSubfolder))', which
# only matches a listed path that is at or below the subfolder being read; the parent-folder entry
# alone (which is enough for attributes/, which is read with no such filter) silently drops the main
# form from the packed zip while pac still exits 0. Ground truth: decompiled slice 4.2, confirmed
# empirically (a pack with only the parent entry produced '<FormXml />' empty in customizations.xml).
#
# SLICE 4.2b: entities/dv_matter/SavedQueries added on the same expectation (subfolder paths need
# their own path entry, per the FormXml lesson above); confirmed empirically by the pack/unpack
# round-trip in this slice's report rather than re-decompiled independently.
#
# SLICE 4.3: entityrelationships added on the same expectation, but for a different reason than
# FormXml/SavedQueries. Decompiling EntityRelationshipProcessor.ReadFromFilesInNewFormat (slice 4.3)
# shows it walks only the entries of context.SolutionInformation.SolutionComponentFiles (this file's
# resolved '@path' values) that are directories at or under entityrelationships/; without a matching
# entry here the folder is never read at all. Confirmed empirically: packing with this entry absent
# produced '<EntityRelationships />' empty in customizations.xml at exit 0, the same silent-omission
# shape G9 documents for solutioncomponents.yml generally. See docs/receipts/wave4-3-refusal-pair.md.
#
# SLICE 4.6t: appmodules/dv_MatterApp and appmodulesitemaps/dv_MatterApp added on the STRICTEST version
# of the lesson 2 pattern yet. Decompiling AppModuleProcessor.ReadFromFiles and
# AppModuleSitemapProcessor.ReadFromFiles (SolutionPackagerLib.dll, pac CLI 2.10.1) shows both walk
# Directory.GetDirectories(<appmodules|appmodulesitemaps>) and require an EXACT match
# (`SolutionComponentFiles.Contains(item)`) of each subfolder's own resolved path -- not the StartsWith
# prefix check FormXml/SavedQueries rely on. A parent-only "appmodules" entry would not satisfy this
# check; the subfolder itself must be listed. Confirmed empirically in this slice's report (packed
# customizations.xml carries AppModule/AppModuleSiteMap content only once these two entries are present).
#
# SLICE 4.4b: pluginassemblies and sdkmessageprocessingsteps added, both on the StartsWith-prefix
# pattern (FormXml/SavedQueries/entityrelationships's pattern, not appmodules's strict one). Both
# entries are load-bearing, confirmed empirically, not merely by decompile:
#   - pluginassemblies/DVerse.Plugins.yml is deliberately NOT named "PluginAssemblies.yml" (the single
#     collection-file name PluginAssemblyProcessor's primary read branch looks for), because that
#     primary branch never loads the referenced DLL's bytes (LoadComponentFiles is not called on it) --
#     a first attempt using that name packed exit 0 with the DLL silently absent from the zip. Any
#     other file name forces PluginAssemblyProcessor.ReadFromFiles into its SECOND branch
#     (isFileBackedComponent && Directory.Exists(...)), which builds the SolutionPluginAssemblies
#     wrapper in code, scans this folder for "*.yml" via GetComponentFiles -> ApplySolutionFilter (this
#     path entry), and DOES call LoadComponentFiles, embedding the DLL bytes into the packed zip.
#     Without this '@path' entry the filter drops the file entirely (the standard lesson 2 shape).
#   - sdkmessageprocessingsteps/*.yml: SdkMessageProcessingStepProcessor.ReadFromFiles ALWAYS calls
#     Directory.GetFiles(mainDirectory, "*.yml", AllDirectories) followed by ApplySolutionFilter, no
#     bypass branch exists for this type at all.
# Both decompiled against pac 2.10.1's SolutionPackagerLib.dll (ilspycmd); see
# pluginassemblies/DVerse.Plugins.yml and sdkmessageprocessingsteps/dv_matter_Create_MatterNumberValidator.yml
# for the full citations, including the empirical pack-and-inspect trail that found the file-naming
# trap above. Presence of both components AND the DLL part in the packed zip verified empirically in
# this slice's report per lesson 2's guard, not assumed from the entries alone.
SolutionComponents:
  Component:
    - '@path': publishers/dversepublisher
    - '@path': entities/dv_matter
    - '@path': entities/dv_matter/FormXml/main
    - '@path': entities/dv_matter/SavedQueries
    - '@path': entityrelationships
    - '@path': appmodules/dv_MatterApp
    - '@path': appmodulesitemaps/dv_MatterApp
    - '@path': pluginassemblies
    - '@path': sdkmessageprocessingsteps
    - '@path': canvasapps
